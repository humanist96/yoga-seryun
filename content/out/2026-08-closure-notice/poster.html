<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>요가명상, 세련 — 8월 휴관 안내</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1440px; }
  body {
    font-family: "Gowun Batang", "NanumMyeongjo", serif;
    background: #f6f3ec;
    position: relative;
    overflow: hidden;
    color: #3f4f3e;
  }
  /* soft organic blobs */
  .blob { position: absolute; border-radius: 50%; z-index: 0; }
  .blob-pink   { width: 360px; height: 360px; left: -60px; top: 190px; background: #f3e4dc; }
  .blob-green1 { width: 420px; height: 470px; right: -140px; top: -120px; background: #e9ecdb; border-radius: 46% 54% 58% 42% / 52% 44% 56% 48%; }
  .blob-green2 { width: 460px; height: 520px; right: -150px; bottom: 60px; background: #eaeddc; border-radius: 55% 45% 42% 58% / 48% 55% 45% 52%; }
  .blob-green3 { width: 300px; height: 280px; left: -90px; bottom: -70px; background: #e9ecdb; border-radius: 48% 52% 55% 45% / 55% 48% 52% 45%; }
  .ring { position: absolute; border: 1.5px solid #cfa88b; border-radius: 50%; z-index: 0; }
  .ring1 { width: 380px; height: 380px; left: -150px; bottom: -110px; }
  .ring2 { width: 300px; height: 300px; right: -110px; top: 330px; }

  /* thin frame */
  .frame {
    position: absolute; inset: 30px; border: 1.5px solid #c8a184;
    border-radius: 8px; z-index: 1;
  }

  .leaves { position: absolute; z-index: 2; }

  .content { position: relative; z-index: 3; height: 100%; display: flex; flex-direction: column; align-items: center; }

  .brand-top {
    margin-top: 64px;
    font-size: 37px; letter-spacing: 0.42em; text-indent: 0.42em;
    color: #43503f;
  }
  h1 {
    margin-top: 26px;
    font-size: 100px; font-weight: 700; letter-spacing: 0.04em;
    color: #3c4b3a;
  }
  .divider { margin-top: 22px; display: flex; align-items: center; }
  .divider .line { width: 210px; height: 1.5px; background: #c8a184; }
  .divider .dot { width: 11px; height: 11px; border-radius: 50%; background: #8a2f1f; margin: 0 4px; }

  .table {
    margin-top: 26px;
    width: 640px;
    border: 1.5px solid #d2ab8a;
    border-radius: 26px;
    background: rgba(252, 250, 244, 0.55);
    padding: 14px 44px;
  }
  .row { display: flex; align-items: center; padding: 17px 0; }
  .row + .row { border-top: 1.5px dashed #ddc09e; }
  .row .date { flex: 0 0 300px; text-align: center; }
  .row .date .d { font-size: 44px; color: #474d42; letter-spacing: 0.02em; }
  .row .date .w { font-size: 27px; color: #6a6f63; margin-top: 6px; }
  .row .sep { width: 1.5px; align-self: stretch; background: #d8b795; margin: -6px 0; }
  .row .why {
    flex: 1; text-align: center;
    font-size: 36px; color: #a5271b; line-height: 1.5;
  }

  .notes { margin-top: 26px; text-align: center; font-size: 31px; color: #3e463c; line-height: 1.7; }
  .notes .em { color: #a5271b; font-weight: 700; }
  .notes .thanks { margin-top: 12px; }

  .footer { margin-top: auto; margin-bottom: 54px; display: flex; flex-direction: column; align-items: center; }
  .footer .divider { margin: 0 0 24px; }
  .footer .divider .line { width: 250px; }
  .footer .slogan { font-size: 27px; letter-spacing: 0.28em; text-indent: 0.28em; color: #43503f; }
  .footer .brand { margin-top: 14px; font-size: 27px; letter-spacing: 0.18em; text-indent: 0.18em; color: #43503f; }
</style>
</head>
<body>
  <div class="blob blob-pink"></div>
  <div class="blob blob-green1"></div>
  <div class="blob blob-green2"></div>
  <div class="blob blob-green3"></div>
  <div class="ring ring1"></div>
  <div class="ring ring2"></div>
  <div class="frame"></div>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <linearGradient id="leafG" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#55604e"/>
        <stop offset="1" stop-color="#8d9a85"/>
      </linearGradient>
      <linearGradient id="leafL" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#93a08a"/>
        <stop offset="1" stop-color="#c2cbb6"/>
      </linearGradient>
      <g id="leaf">
        <path d="M0,0 C26,-34 78,-46 118,-34 C112,6 70,34 30,30 C12,26 2,14 0,0 Z"/>
        <path d="M4,-2 C40,-20 80,-30 112,-32" fill="none" stroke="#f4f1e8" stroke-width="2.5" opacity="0.6"/>
      </g>
      <g id="branch">
        <path d="M0,300 C40,190 90,90 210,0" fill="none" stroke="#5f6a56" stroke-width="4"/>
        <use href="#leaf" fill="url(#leafG)" transform="translate(28,235) rotate(-118) scale(0.62)"/>
        <use href="#leaf" fill="url(#leafL)" transform="translate(52,196) rotate(28) scale(0.55)"/>
        <use href="#leaf" fill="url(#leafG)" transform="translate(76,152) rotate(-124) scale(0.70)"/>
        <use href="#leaf" fill="url(#leafG)" transform="translate(102,118) rotate(22) scale(0.63)"/>
        <use href="#leaf" fill="url(#leafL)" transform="translate(132,84) rotate(-130) scale(0.58)"/>
        <use href="#leaf" fill="url(#leafG)" transform="translate(160,52) rotate(16) scale(0.68)"/>
        <use href="#leaf" fill="url(#leafG)" transform="translate(186,24) rotate(-136) scale(0.5)"/>
        <use href="#leaf" fill="url(#leafL)" transform="translate(206,4) rotate(8) scale(0.44)"/>
      </g>
    </defs>
  </svg>

  <svg class="leaves" style="left:34px; top:34px" width="280" height="320" viewBox="0 0 330 380">
    <use href="#branch" transform="translate(298,26) rotate(118) scale(0.86)"/>
  </svg>
  <svg class="leaves" style="right:24px; top:46px" width="250" height="300" viewBox="0 0 300 360">
    <use href="#branch" transform="translate(50,290) rotate(-14) scale(0.76) scale(-1,1) translate(-230,-300)"/>
  </svg>
  <svg class="leaves" style="right:36px; bottom:210px" width="290" height="400" viewBox="0 0 360 460">
    <use href="#branch" transform="translate(265,385) rotate(174) scale(1.05)"/>
  </svg>
  <svg class="leaves" style="left:38px; bottom:36px" width="240" height="210" viewBox="0 0 300 260">
    <use href="#branch" transform="translate(8,8) rotate(64) scale(0.62)"/>
  </svg>

  <div class="content">
    <div class="brand-top">요가명상, 세련</div>
    <h1>8월 휴관 안내</h1>
    <div class="divider"><div class="line"></div><div class="dot"></div><div class="line"></div></div>

    <div class="table">
      <div class="row">
        <div class="date"><div class="d">8월 15일</div><div class="w">(토요일)</div></div>
        <div class="sep"></div>
        <div class="why">광복절</div>
      </div>
      <div class="row">
        <div class="date"><div class="d">8월 17일</div><div class="w">(월요일)</div></div>
        <div class="sep"></div>
        <div class="why">대체공휴일</div>
      </div>
      <div class="row">
        <div class="date"><div class="d">8월 29일</div><div class="w">(토요일)</div></div>
        <div class="sep"></div>
        <div class="why">마지막 주<br>토요일 휴관</div>
      </div>
    </div>

    <div class="notes">
      <div>휴관일 (<span class="em">3일</span>)만큼 회원권이 자동 연장됩니다.</div>
      <div>휴관일을 제외한 수업은</div>
      <div>모두 정상적으로 진행됩니다.</div>
      <div class="thanks">감사합니다.</div>
    </div>

    <div class="footer">
      <div class="divider"><div class="line"></div><div class="dot"></div><div class="line"></div></div>
      <div class="slogan">비움과 채움이 있는 다정한 공간</div>
      <div class="brand">요가명상, 세련</div>
    </div>
  </div>
</body>
</html>
