<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>요가명상, 세련 — 8월 휴관 안내</title>
<style>
  /* A4 비율 캔버스 1240×1754 (300dpi 렌더 시 2480×3508) */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1240px; height: 1754px; }
  body {
    font-family: "NanumMyeongjo", "Gowun Batang", serif;
    background: #f6f3ec;
    position: relative;
    overflow: hidden;
    color: #3f4f3e;
  }
  /* soft organic blobs */
  .blob { position: absolute; border-radius: 50%; z-index: 0; }
  .blob-pink   { width: 410px; height: 410px; left: -70px; top: 230px; background: #f3e4dc; }
  .blob-green1 { width: 480px; height: 540px; right: -160px; top: -140px; background: #e9ecdb; border-radius: 46% 54% 58% 42% / 52% 44% 56% 48%; }
  .blob-green2 { width: 530px; height: 600px; right: -170px; bottom: 80px; background: #eaeddc; border-radius: 55% 45% 42% 58% / 48% 55% 45% 52%; }
  .blob-green3 { width: 340px; height: 320px; left: -100px; bottom: -80px; background: #e9ecdb; border-radius: 48% 52% 55% 45% / 55% 48% 52% 45%; }
  .ring { position: absolute; border: 2px solid #cfa88b; border-radius: 50%; z-index: 0; }
  .ring1 { width: 430px; height: 430px; left: -170px; bottom: -130px; }
  .ring2 { width: 340px; height: 340px; right: -125px; top: 400px; }

  /* thin frame */
  .frame {
    position: absolute; inset: 34px; border: 2px solid #c8a184;
    border-radius: 9px; z-index: 1;
  }

  .leaves { position: absolute; z-index: 2; }

  .content { position: relative; z-index: 3; height: 100%; display: flex; flex-direction: column; align-items: center; }

  .brand-top {
    margin-top: 88px;
    font-size: 42px; letter-spacing: 0.42em; text-indent: 0.42em;
    color: #43503f;
  }
  h1 {
    margin-top: 20px;
    font-size: 128px; font-weight: 800; letter-spacing: 0.04em;
    font-family: "NanumMyeongjoExtraBold", "NanumMyeongjo", serif;
    color: #3c4b3a;
  }
  .divider { margin-top: 30px; display: flex; align-items: center; }
  .divider .line { width: 240px; height: 2px; background: #c8a184; }
  .divider .dot { width: 13px; height: 13px; border-radius: 50%; background: #8a2f1f; margin: 0 5px; }

  .table {
    margin-top: 36px;
    width: 960px;
    border: 2px solid #d2ab8a;
    border-radius: 30px;
    background: rgba(252, 250, 244, 0.55);
    padding: 16px 56px;
  }
  .row { display: flex; align-items: center; padding: 28px 0; }
  .row + .row { border-top: 2px dashed #ddc09e; }
  .row .date { flex: 0 0 470px; text-align: center; }
  .row .date .d { font-size: 86px; color: #474d42; letter-spacing: 0.02em; }
  .row .date .w { font-size: 44px; color: #6a6f63; margin-top: 8px; }
  .row .sep { width: 2px; align-self: stretch; background: #d8b795; margin: -7px 0; }
  .row .why {
    flex: 1; text-align: center;
    font-size: 58px; color: #a5271b; line-height: 1.45;
  }

  .notes { margin-top: 36px; text-align: center; font-size: 44px; color: #3e463c; line-height: 1.6; }
  .notes .em { color: #a5271b; font-weight: 700; }
  .notes .thanks { margin-top: 14px; }

  .footer { margin-top: auto; margin-bottom: 58px; display: flex; flex-direction: column; align-items: center; }
  .footer .divider { margin: 0 0 20px; }
  .footer .divider .line { width: 290px; }
  .footer .slogan { font-size: 31px; letter-spacing: 0.28em; text-indent: 0.28em; color: #43503f; }
  .footer .brand { margin-top: 18px; font-size: 31px; letter-spacing: 0.18em; text-indent: 0.18em; color: #43503f; }
</style>
</head>
<body>
  <div class="blob blob-pink"></div>
  <div class="blob blob-green1"></div>
  <div class="blob blob-green2"></div>
  <div class="blob blob-green3"></div>
  <div class="ring ring1"></div>
  <div class="ring ring2"></div>
  <div class="frame"></div>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <filter id="wc" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/>
      </filter>
      <linearGradient id="leafG" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#4c5846"/>
        <stop offset="1" stop-color="#7d8a74"/>
      </linearGradient>
      <linearGradient id="leafG2" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#5a6753"/>
        <stop offset="1" stop-color="#8e9b84"/>
      </linearGradient>
      <linearGradient id="leafL" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#9aa78f"/>
        <stop offset="1" stop-color="#cbd4bd"/>
      </linearGradient>
      <g id="lf">
        <path d="M0,0 C16,-22 58,-34 94,-26 C102,-24 104,-18 100,-13 C82,6 34,14 6,5 C1,3 -2,1 0,0 Z"/>
        <path d="M3,-1 C34,-14 68,-22 97,-19" fill="none" stroke="#f4f1e8" stroke-width="2" opacity="0.5"/>
      </g>
      <g id="br">
        <path d="M0,340 C30,220 70,100 190,0" fill="none" stroke="#57614e" stroke-width="4.5"/>
        <use href="#lf" fill="url(#leafG)"  transform="translate(6,318)  rotate(-122) scale(0.72)"/>
        <use href="#lf" fill="url(#leafG2)" transform="translate(16,290) rotate(38)   scale(0.66)"/>
        <use href="#lf" fill="url(#leafG)"  transform="translate(28,258) rotate(-118) scale(0.78)"/>
        <use href="#lf" fill="url(#leafL)"  transform="translate(42,226) rotate(34)   scale(0.62)"/>
        <use href="#lf" fill="url(#leafG2)" transform="translate(57,194) rotate(-124) scale(0.74)"/>
        <use href="#lf" fill="url(#leafG)"  transform="translate(74,163) rotate(28)   scale(0.70)"/>
        <use href="#lf" fill="url(#leafL)"  transform="translate(93,132) rotate(-128) scale(0.60)"/>
        <use href="#lf" fill="url(#leafG)"  transform="translate(113,103) rotate(24)  scale(0.66)"/>
        <use href="#lf" fill="url(#leafG2)" transform="translate(135,76) rotate(-132) scale(0.58)"/>
        <use href="#lf" fill="url(#leafL)"  transform="translate(157,51) rotate(18)   scale(0.52)"/>
        <use href="#lf" fill="url(#leafG)"  transform="translate(176,29) rotate(-138) scale(0.46)"/>
        <use href="#lf" fill="url(#leafG2)" transform="translate(192,11) rotate(10)   scale(0.40)"/>
      </g>
    </defs>
  </svg>

  <svg class="leaves" filter="url(#wc)" style="left:32px; top:30px" width="300" height="370" viewBox="0 0 340 420">
    <use href="#br" transform="translate(306,18) rotate(116) scale(0.82)"/>
  </svg>
  <svg class="leaves" filter="url(#wc)" style="right:26px; top:40px" width="220" height="280" viewBox="0 0 300 390">
    <use href="#br" transform="translate(40,330) rotate(-16) scale(0.78) scale(-1,1) translate(-200,-340)"/>
  </svg>
  <svg class="leaves" filter="url(#wc)" style="right:28px; bottom:64px" width="320" height="470" viewBox="0 0 320 470">
    <use href="#br" transform="translate(285,455) rotate(172) scale(1.1)"/>
  </svg>
  <svg class="leaves" filter="url(#wc)" style="left:42px; bottom:42px" width="280" height="250" viewBox="0 0 280 250">
    <use href="#br" transform="translate(6,6) rotate(62) scale(0.55)"/>
  </svg>

  <div class="content">
    <div class="brand-top">요가명상, 세련</div>
    <h1>8월 휴관 안내</h1>
    <div class="divider"><div class="line"></div><div class="dot"></div><div class="line"></div></div>

    <div class="table">
      <div class="row">
        <div class="date"><div class="d">8월 15일</div><div class="w">(토요일)</div></div>
        <div class="sep"></div>
        <div class="why">광복절</div>
      </div>
      <div class="row">
        <div class="date"><div class="d">8월 17일</div><div class="w">(월요일)</div></div>
        <div class="sep"></div>
        <div class="why">대체공휴일</div>
      </div>
      <div class="row">
        <div class="date"><div class="d">8월 29일</div><div class="w">(토요일)</div></div>
        <div class="sep"></div>
        <div class="why">마지막 주<br>토요일 휴관</div>
      </div>
    </div>

    <div class="notes">
      <div>휴관일 (3일)만큼 회원권이 자동 연장됩니다.</div>
      <div>휴관일을 제외한 수업은</div>
      <div>모두 정상적으로 진행됩니다.</div>
      <div class="thanks">감사합니다.</div>
    </div>

    <div class="footer">
      <div class="divider"><div class="line"></div><div class="dot"></div><div class="line"></div></div>
      <div class="slogan">비움과 채움이 있는 다정한 공간</div>
      <div class="brand">요가명상, 세련</div>
    </div>
  </div>
</body>
</html>
