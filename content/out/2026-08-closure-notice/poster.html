<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>요가명상, 세련 — 8월 휴관 안내</title>
<style>
  /* A4 비율 캔버스 1240×1754 (300dpi 렌더 시 2480×3508) */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1240px; height: 1754px; }
  body {
    font-family: "Gowun Batang", "NanumMyeongjo", serif;
    background: #f6f3ec;
    position: relative;
    overflow: hidden;
    color: #3f4f3e;
  }
  /* soft organic blobs */
  .blob { position: absolute; border-radius: 50%; z-index: 0; }
  .blob-pink   { width: 410px; height: 410px; left: -70px; top: 230px; background: #f3e4dc; }
  .blob-green1 { width: 480px; height: 540px; right: -160px; top: -140px; background: #e9ecdb; border-radius: 46% 54% 58% 42% / 52% 44% 56% 48%; }
  .blob-green2 { width: 530px; height: 600px; right: -170px; bottom: 80px; background: #eaeddc; border-radius: 55% 45% 42% 58% / 48% 55% 45% 52%; }
  .blob-green3 { width: 340px; height: 320px; left: -100px; bottom: -80px; background: #e9ecdb; border-radius: 48% 52% 55% 45% / 55% 48% 52% 45%; }
  .ring { position: absolute; border: 2px solid #cfa88b; border-radius: 50%; z-index: 0; }
  .ring1 { width: 430px; height: 430px; left: -170px; bottom: -130px; }
  .ring2 { width: 340px; height: 340px; right: -125px; top: 400px; }

  /* thin frame */
  .frame {
    position: absolute; inset: 34px; border: 2px solid #c8a184;
    border-radius: 9px; z-index: 1;
  }

  .leaves { position: absolute; z-index: 2; }

  .content { position: relative; z-index: 3; height: 100%; display: flex; flex-direction: column; align-items: center; }

  .brand-top {
    margin-top: 88px;
    font-size: 42px; letter-spacing: 0.42em; text-indent: 0.42em;
    color: #43503f;
  }
  h1 {
    margin-top: 20px;
    font-size: 128px; font-weight: 700; letter-spacing: 0.04em;
    color: #3c4b3a;
  }
  .divider { margin-top: 30px; display: flex; align-items: center; }
  .divider .line { width: 240px; height: 2px; background: #c8a184; }
  .divider .dot { width: 13px; height: 13px; border-radius: 50%; background: #8a2f1f; margin: 0 5px; }

  .table {
    margin-top: 36px;
    width: 960px;
    border: 2px solid #d2ab8a;
    border-radius: 30px;
    background: rgba(252, 250, 244, 0.55);
    padding: 16px 56px;
  }
  .row { display: flex; align-items: center; padding: 28px 0; }
  .row + .row { border-top: 2px dashed #ddc09e; }
  .row .date { flex: 0 0 470px; text-align: center; }
  .row .date .d { font-size: 86px; color: #474d42; letter-spacing: 0.02em; }
  .row .date .w { font-size: 44px; color: #6a6f63; margin-top: 8px; }
  .row .sep { width: 2px; align-self: stretch; background: #d8b795; margin: -7px 0; }
  .row .why {
    flex: 1; text-align: center;
    font-size: 58px; color: #a5271b; line-height: 1.45;
  }

  .notes { margin-top: 36px; text-align: center; font-size: 44px; color: #3e463c; line-height: 1.6; }
  .notes .em { color: #a5271b; font-weight: 700; }
  .notes .thanks { margin-top: 14px; }

  .footer { margin-top: auto; margin-bottom: 58px; display: flex; flex-direction: column; align-items: center; }
  .footer .divider { margin: 0 0 20px; }
  .footer .divider .line { width: 290px; }
  .footer .slogan { font-size: 31px; letter-spacing: 0.28em; text-indent: 0.28em; color: #43503f; }
  .footer .brand { margin-top: 18px; font-size: 31px; letter-spacing: 0.18em; text-indent: 0.18em; color: #43503f; }
</style>
</head>
<body>
  <div class="blob blob-pink"></div>
  <div class="blob blob-green1"></div>
  <div class="blob blob-green2"></div>
  <div class="blob blob-green3"></div>
  <div class="ring ring1"></div>
  <div class="ring ring2"></div>
  <div class="frame"></div>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <linearGradient id="leafG" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#55604e"/>
        <stop offset="1" stop-color="#8d9a85"/>
      </linearGradient>
      <linearGradient id="leafL" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#93a08a"/>
        <stop offset="1" stop-color="#c2cbb6"/>
      </linearGradient>
      <g id="leaf">
        <path d="M0,0 C26,-34 78,-46 118,-34 C112,6 70,34 30,30 C12,26 2,14 0,0 Z"/>
        <path d="M4,-2 C40,-20 80,-30 112,-32" fill="none" stroke="#f4f1e8" stroke-width="2.5" opacity="0.6"/>
      </g>
      <g id="branch">
        <path d="M0,300 C40,190 90,90 210,0" fill="none" stroke="#5f6a56" stroke-width="4"/>
        <use href="#leaf" fill="url(#leafG)" transform="translate(28,235) rotate(-118) scale(0.62)"/>
        <use href="#leaf" fill="url(#leafL)" transform="translate(52,196) rotate(28) scale(0.55)"/>
        <use href="#leaf" fill="url(#leafG)" transform="translate(76,152) rotate(-124) scale(0.70)"/>
        <use href="#leaf" fill="url(#leafG)" transform="translate(102,118) rotate(22) scale(0.63)"/>
        <use href="#leaf" fill="url(#leafL)" transform="translate(132,84) rotate(-130) scale(0.58)"/>
        <use href="#leaf" fill="url(#leafG)" transform="translate(160,52) rotate(16) scale(0.68)"/>
        <use href="#leaf" fill="url(#leafG)" transform="translate(186,24) rotate(-136) scale(0.5)"/>
        <use href="#leaf" fill="url(#leafL)" transform="translate(206,4) rotate(8) scale(0.44)"/>
      </g>
    </defs>
  </svg>

  <svg class="leaves" style="left:40px; top:40px" width="320" height="366" viewBox="0 0 330 380">
    <use href="#branch" transform="translate(298,26) rotate(118) scale(0.98)"/>
  </svg>
  <svg class="leaves" style="right:28px; top:56px" width="286" height="344" viewBox="0 0 300 360">
    <use href="#branch" transform="translate(50,290) rotate(-14) scale(0.76) scale(-1,1) translate(-230,-300)"/>
  </svg>
  <svg class="leaves" style="right:30px; bottom:70px" width="300" height="414" viewBox="0 0 360 460">
    <use href="#branch" transform="translate(265,385) rotate(174) scale(1.05)"/>
  </svg>
  <svg class="leaves" style="left:44px; bottom:44px" width="274" height="240" viewBox="0 0 300 260">
    <use href="#branch" transform="translate(8,8) rotate(64) scale(0.62)"/>
  </svg>

  <div class="content">
    <div class="brand-top">요가명상, 세련</div>
    <h1>8월 휴관 안내</h1>
    <div class="divider"><div class="line"></div><div class="dot"></div><div class="line"></div></div>

    <div class="table">
      <div class="row">
        <div class="date"><div class="d">8월 15일</div><div class="w">(토요일)</div></div>
        <div class="sep"></div>
        <div class="why">광복절</div>
      </div>
      <div class="row">
        <div class="date"><div class="d">8월 17일</div><div class="w">(월요일)</div></div>
        <div class="sep"></div>
        <div class="why">대체공휴일</div>
      </div>
      <div class="row">
        <div class="date"><div class="d">8월 29일</div><div class="w">(토요일)</div></div>
        <div class="sep"></div>
        <div class="why">마지막 주<br>토요일 휴관</div>
      </div>
    </div>

    <div class="notes">
      <div>휴관일 (3일)만큼 회원권이 자동 연장됩니다.</div>
      <div>휴관일을 제외한 수업은</div>
      <div>모두 정상적으로 진행됩니다.</div>
      <div class="thanks">감사합니다.</div>
    </div>

    <div class="footer">
      <div class="divider"><div class="line"></div><div class="dot"></div><div class="line"></div></div>
      <div class="slogan">비움과 채움이 있는 다정한 공간</div>
      <div class="brand">요가명상, 세련</div>
    </div>
  </div>
</body>
</html>
